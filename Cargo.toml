[workspace]
resolver = "2"
members = ["crates/equinox-core", "crates/equinox-daemon", "crates/equinox-gui"]

[workspace.package]
version = "0.1.3-a3"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["nwkyz"]

[workspace.dependencies]
glib = "0.22"
gio = "0.22"
gtk4 = "0.11"
libadwaita = "0.9"
soup3 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
anyhow = "1"
log = "0.4"
rand = "0.10"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
signal-hook = "0.3"
futures-channel = "0.3"

[profile.release]
lto = true
strip = true
