[package]
name = "equinox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gettext-rs.workspace = true
glib.workspace = true
gio.workspace = true
soup3.workspace = true
imagesize = "0.13"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
rand.workspace = true
