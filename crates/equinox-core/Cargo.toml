# NOTE: no image-decoder dependency here on purpose. Image dimensions are
# read header-only by `imagesize` (pure Rust, no decoder linked). Thumbnail
# generation lives in the GUI crate, which is the only component allowed to
# link gdk-pixbuf + the platform loader stack (glycin on GNOME) — the
# daemon stays small at idle.
